<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060609"/>
      <stop offset="100%" style="stop-color:#0c0e14"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pathGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- 6 radiating arms — agent lanes -->
  <line x1="256" y1="160" x2="256" y2="72" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="256" cy="56" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <line x1="330" y1="205" x2="398" y2="138" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="410" cy="126" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <line x1="330" y1="307" x2="398" y2="374" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="410" cy="386" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <line x1="256" y1="352" x2="256" y2="440" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="256" cy="456" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <line x1="182" y1="307" x2="114" y2="374" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="102" cy="386" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <line x1="182" y1="205" x2="114" y2="138" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="102" cy="126" r="12" fill="#0c0e14" stroke="#22d3ee" stroke-width="3" filter="url(#pathGlow)"/>

  <!-- Hex core background -->
  <polygon points="256,150 365,213 365,299 256,362 147,299 147,213" fill="#060609" stroke="none"/>
  <!-- Hex core stroke -->
  <polygon points="256,150 365,213 365,299 256,362 147,299 147,213" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 6 convergence lines to center -->
  <line x1="256" y1="150" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>
  <line x1="365" y1="213" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>
  <line x1="365" y1="299" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="362" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>
  <line x1="147" y1="299" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>
  <line x1="147" y1="213" x2="256" y2="256" stroke="#f1f5f9" stroke-width="2" opacity="0.6"/>

  <!-- Center conductor node -->
  <circle cx="256" cy="256" r="20" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="9" fill="#060609"/>
</svg>