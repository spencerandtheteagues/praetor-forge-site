<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060609"/>
      <stop offset="100%" style="stop-color:#0c0e14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pathGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background - no fill, used as overlay -->
  
  <!-- 6 radiating arms — agent lanes (thick, prominent) -->
  <line x1="400" y1="225" x2="400" y2="90" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="400" cy="64" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <line x1="520" y1="315" x2="630" y2="205" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="650" cy="185" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <line x1="520" y1="485" x2="630" y2="595" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="650" cy="615" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <line x1="400" y1="575" x2="400" y2="710" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="400" cy="736" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <line x1="280" y1="485" x2="170" y2="595" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="150" cy="615" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <line x1="280" y1="315" x2="170" y2="205" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" filter="url(#pathGlow)"/>
  <circle cx="150" cy="185" r="20" fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#pathGlow)"/>

  <!-- Hex core background -->
  <polygon points="400,210 570,308 570,492 400,590 230,492 230,308" fill="#060609" stroke="none"/>
  <!-- Hex core stroke -->
  <polygon points="400,210 570,308 570,492 400,590 230,492 230,308" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 6 convergence lines to center -->
  <line x1="400" y1="210" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>
  <line x1="570" y1="308" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>
  <line x1="570" y1="492" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>
  <line x1="400" y1="590" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>
  <line x1="230" y1="492" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>
  <line x1="230" y1="308" x2="400" y2="400" stroke="#f1f5f9" stroke-width="2.5" opacity="0.5"/>

  <!-- Center conductor node -->
  <circle cx="400" cy="400" r="35" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="15" fill="#060609"/>
</svg>